<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>欢迎</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-size: 400% 400%;
    animation: bgShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 48px 36px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .icon {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    margin: 0 auto 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
    50%      { transform: scale(1.06); box-shadow: 0 15px 40px rgba(102, 126, 234, 0.55); }
  }
  .icon svg { width: 44px; height: 44px; fill: #fff; }
  h1 {
    font-size: 26px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 14px;
    letter-spacing: -0.3px;
  }
  .subtitle {
    font-size: 15px;
    color: #5f6c86;
    line-height: 1.6;
    margin-bottom: 36px;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 18px 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(102, 126, 234, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .btn:active {
    transform: scale(0.97);
    box-shadow: 0 5px 16px rgba(102, 126, 234, 0.3);
  }
  .btn::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.6s ease;
  }
  .btn:active::after, .btn:hover::after { left: 100%; }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: #a8b0c4;
  }
  .loading {
    display: none;
    margin-top: 24px;
    font-size: 14px;
    color: #667eea;
    font-weight: 500;
  }
  .loading.show { display: block; }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2.5px solid rgba(102, 126, 234, 0.2);
    border-top-color: #667eea;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
    </div>
    <h1>欢迎访问</h1>
    <p class="subtitle">请点击下方按钮继续浏览，为您展示完整内容。</p>
    <button class="btn" id="goBtn">点击查看</button>
    <div class="loading" id="loading">
      <span class="spinner"></span>加载中，请稍候...
    </div>
    <div class="footer">Secure Connection · SSL Encrypted</div>
  </div>

<script>
  (function () {
    var btn = document.getElementById('goBtn');
    var loading = document.getElementById('loading');
    function triggerReload() {
      loading.classList.add('show');
      btn.disabled = true;
      btn.style.opacity = '0.7';
      setTimeout(function () {
        try {
          if (window.parent && window.parent !== window) {
            try { window.parent.location.reload(); } catch (e) {}
          }
        } catch (e) {}
        setTimeout(function () {
          window.location.reload();
        }, 300);
      }, 500);
    }
    btn.addEventListener('click', triggerReload);
    btn.addEventListener('touchstart', function () {}, { passive: true });
  })();
</script>
</body>
</html>
